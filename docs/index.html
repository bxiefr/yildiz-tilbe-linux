<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yıldız Tilbe Linux</title>
  <style>
    :root { --pembe: #ff3d9a; --mor: #6a1b9a; --koyu: #1a0b2e; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; color: #fff; text-align: center;
      background: linear-gradient(135deg, var(--koyu), var(--mor));
    }
    main { padding: 2rem 1rem; max-width: 640px; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 .5rem; color: var(--pembe); }
    p { font-size: 1.15rem; line-height: 1.6; }
    .btn {
      display: inline-block; margin: 1rem .4rem; padding: .9rem 1.6rem;
      background: var(--pembe); color: #fff; border-radius: 999px;
      text-decoration: none; font-weight: 700;
    }
    .btn.ikinci { background: transparent; border: 2px solid var(--pembe); }
    code { background: rgba(255,255,255,.12); padding: .2rem .5rem; border-radius: 6px; }
    small { opacity: .7; display: block; margin-top: 2rem; }
  </style>
</head>
<body>
  <main>
    <h1>Yıldız Tilbe Linux</h1>
    <p>GNU/Linux'tan daha büyük olma yolunda. Debian tabanlı, XFCE masaüstlü, tamamen meme.</p>
    <a class="btn" href="https://github.com/KULLANICI_ADIN/yildiz-tilbe-linux/releases/latest">ISO İndir</a>
    <a class="btn ikinci" href="https://github.com/KULLANICI_ADIN/yildiz-tilbe-linux">GitHub</a>
    <p>Kurulumdan sonra terminale <code>yildiz</code> yaz.</p>
    <small>Resmi değildir, parodi bir hobi projesidir. Yıldız Tilbe ile bağlantısı yoktur.</small>
  </main>
</body>
</html>
